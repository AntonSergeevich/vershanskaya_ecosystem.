# nginx для VPS. Положить в /etc/nginx/sites-available/vershanskaya
# и слинковать в sites-enabled, затем `sudo nginx -t && sudo systemctl reload nginx`.
#
# Сертификат проще всего получить через certbot --nginx: он сам допишет
# блок listen 443 и пути к ключам.

upstream vershanskaya_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name vershanskaya.ru www.vershanskaya.ru;

    # Видео уроков — до 500 МБ, стандартный лимит nginx их отрежет.
    client_max_body_size 512M;

    access_log /var/log/nginx/vershanskaya.access.log;
    error_log  /var/log/nginx/vershanskaya.error.log;

    location /static/ {
        alias /srv/vershanskaya/staticfiles/;
        # Имена файлов после collectstatic содержат хеш, поэтому кешировать
        # можно навсегда: изменился файл — изменилось имя.
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/vershanskaya/media/;
        expires 30d;
    }

    # Видео уроков. internal — значит снаружи по этому адресу не зайти:
    # nginx отдаёт файл только по заголовку X-Accel-Redirect от Django,
    # а Django ставит его лишь после проверки доступа к курсу.
    location /protected-media/ {
        internal;
        alias /srv/vershanskaya/protected_media/;
    }

    location / {
        proxy_pass http://vershanskaya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без этого заголовка Django с SECURE_SSL_REDIRECT уйдёт в цикл
        # редиректов: он не увидит, что снаружи уже HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Долгая загрузка видео в админку.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
